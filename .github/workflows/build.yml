name: Build MapleOS candidate ISO
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mapleos-iso
  cancel-in-progress: false
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate source
        run: python3 tools/validate.py
      - name: Resolve and record the builder image
        run: |
          docker pull docker.io/archlinux/archlinux:base
          mkdir -p out
          docker image inspect docker.io/archlinux/archlinux:base --format '{{index .RepoDigests 0}}' > out/builder-image.txt
      - name: Build and boot-test in a disposable Arch container
        run: |
          image=$(cat out/builder-image.txt)
          docker run --rm --privileged             --mount type=bind,source="$GITHUB_WORKSPACE",target=/workspace             --workdir /workspace "$image" bash scripts/ci-build.sh
      - name: Candidate ISO and evidence (not a public release)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapleos-candidate
          path: out/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapleos-build-logs
          path: |
            build/mkarchiso.log
            out/*.log
            out/BOOT-TESTS.json
          retention-days: 7
          if-no-files-found: ignore
